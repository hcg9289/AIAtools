<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAtools</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f4f1ea;
            --surface: #fffdf7;
            --surface-2: #ece6d8;
            --ink: #1d2521;
            --muted: #68736d;
            --line: #d7cdb9;
            --focus: #0f766e;
            --accent: #b7791f;
            --success: #157347;
            --shadow: 0 20px 60px rgba(46, 35, 17, 0.12);
        }

        body {
            min-height: 100vh;
            font-family: "Noto Serif TC", "Microsoft JhengHei", "PingFang TC", serif;
            background:
                linear-gradient(135deg, rgba(183,121,31,0.12), transparent 34%),
                linear-gradient(225deg, rgba(15,118,110,0.10), transparent 38%),
                var(--bg);
            color: var(--ink);
            padding: 28px 18px;
        }

        .shell {
            width: min(1120px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 22px;
            align-items: stretch;
        }

        .brand {
            min-height: 620px;
            padding: 34px;
            border: 1px solid var(--line);
            background: linear-gradient(160deg, #1f2a25 0%, #263b35 52%, #b7791f 140%);
            color: #fff8ea;
            box-shadow: var(--shadow);
            position: sticky;
            top: 24px;
            overflow: hidden;
        }

        .brand::after {
            content: "";
            position: absolute;
            left: 34px;
            right: 34px;
            bottom: 112px;
            height: 1px;
            background: rgba(255,255,255,0.28);
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255,248,234,0.7);
            margin-bottom: 86px;
        }

        h1 {
            font-size: clamp(44px, 7vw, 82px);
            line-height: 0.92;
            letter-spacing: 0;
            max-width: 8ch;
            margin-bottom: 24px;
        }

        .brand p {
            width: min(360px, 100%);
            color: rgba(255,248,234,0.76);
            font-size: 16px;
            line-height: 1.75;
        }

        .brand-mark {
            position: absolute;
            bottom: 32px;
            left: 34px;
            right: 34px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            color: rgba(255,248,234,0.74);
            font-size: 13px;
        }

        .panel {
            background: rgba(255,253,247,0.92);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 28px;
            min-height: 620px;
        }

        .section-title {
            font-size: 15px;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .tool-card {
            display: flex;
            min-width: 0;
            min-height: 92px;
            border: 1px solid var(--line);
            background: var(--surface);
            text-decoration: none;
            color: var(--ink);
            overflow: hidden;
            transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
        }

        .tool-card:hover, .tool-card:focus {
            transform: translateY(-2px);
            border-color: var(--focus);
            box-shadow: 0 18px 36px rgba(46, 35, 17, 0.10);
            outline: none;
        }

        .tool-name {
            width: 100%;
            min-width: 0;
            min-height: 90px;
            display: grid;
            place-items: center;
            padding: 18px 14px;
            border: 0;
            background: transparent;
            color: var(--ink);
            font: 800 clamp(17px, 2.2vw, 23px)/1.3 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            text-align: center;
            text-decoration: none;
        }

        button.tool-name {
            cursor: pointer;
        }

        @media (max-width: 820px) {
            body { padding: 14px; }
            .shell { grid-template-columns: 1fr; }
            .brand { min-height: 340px; position: relative; top: auto; }
            .eyebrow { margin-bottom: 42px; }
            .panel { min-height: auto; padding: 18px; }
            .tool-grid { gap: 10px; }
            .tool-card { min-height: 78px; }
            .tool-name { min-height: 76px; padding: 14px 10px; font-size: 17px; }
        }
    </style>
</head>
<body>
<main class="shell">
    <section class="brand">
        <div class="eyebrow">1008 AIAtools</div>
        <h1>選擇工具</h1>
        <p>這裡是 AIAtools 的工具入口。取得 WhatsApp 專屬連結後，可以在同一個 session 內選擇需要使用的工具。</p>
        <div class="brand-mark">
            <span>Secure OTT Session</span>
            <span>20 Minutes</span>
        </div>
    </section>

    <section class="panel" aria-labelledby="tools-heading">
        <div class="section-title" id="tools-heading">Available Tools</div>
        <div class="tool-grid">
            <form class="tool-card" method="post" action="/launch/1003">
                <input type="hidden" name="csrf_token" value="{{ launch_csrf }}">
                <button class="tool-name" type="submit">稅單整理</button>
            </form>
            <form class="tool-card" method="post" action="/launch/1004">
                <input type="hidden" name="csrf_token" value="{{ launch_csrf }}">
                <button class="tool-name" type="submit">安心出行</button>
            </form>
            <form class="tool-card" method="post" action="/launch/1005">
                <input type="hidden" name="csrf_token" value="{{ launch_csrf }}">
                <button class="tool-name" type="submit">保單總結表</button>
            </form>
            <a class="tool-card" href="/tools/gf" aria-label="開始製作 GF 計劃簡報">
                <span class="tool-name">GF 計劃簡報</span>
            </a>
            <a class="tool-card" href="/tools/gf-model" aria-label="打開 GF 醫療融資工具">
                <span class="tool-name">GF 醫療融資</span>
            </a>
            <a class="tool-card" href="/tools/cold-call-list" aria-label="打開 Cold call申請流程簡化">
                <span class="tool-name">Cold call申請流程簡化</span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
