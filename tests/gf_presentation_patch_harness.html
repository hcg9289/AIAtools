<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>GF presentation patch test</title>
  <link rel="stylesheet" href="../assets/gf/gf_model_presentation.css">
</head>
<body>
  <div id="financeSummary" class="summary"></div>
  <div id="financeNotice" class="notice">舊有研究說明</div>
  <button id="financeDownload" type="button" disabled>下載 CSV</button>
  <div class="tableWrap"><table id="financeTable" class="dataTable finance-table"></table></div>
  <script>
    let currentFinanceResult = null;
    function clearElement(node) { while (node.firstChild) node.removeChild(node.firstChild); }
    function metric(container, label, value) {
      const card = document.createElement('div'); card.className = 'metric';
      const span = document.createElement('span'); span.textContent = label;
      const bold = document.createElement('b'); bold.textContent = value;
      card.append(span, bold); container.append(card);
    }
    function renderFinanceResult(result) {
      currentFinanceResult = result;
      const summary = document.getElementById('financeSummary'); clearElement(summary);
      metric(summary, 'GF 年繳保費', 'USD 4,000');
      metric(summary, '醫療保費總額', 'USD ' + result.requestedTotal);
      metric(summary, '實際累計提款', 'USD ' + result.actualTotal);
      metric(summary, '最終狀態', result.surrendered ? '退保' : '保單持續');
      const table = document.getElementById('financeTable'); clearElement(table);
      table.innerHTML = '<thead><tr><th>年齡</th><th>保單年度</th><th>醫療保費</th><th>實際提款</th><th>累計提款</th><th>保證現金價值</th><th>復歸紅利</th><th>終期紅利</th><th>提款後總額</th><th>狀態</th></tr></thead>';
      const tbody = document.createElement('tbody');
      result.rows.forEach((item) => {
        const row = document.createElement('tr');
        if (item.requested_withdrawal) row.className = 'active-row';
        [
          item.age, item.policy_year, item.requested_withdrawal, item.withdrawal_total,
          item.cumulative_withdrawal, item.post_guaranteed_cash, item.post_reversionary_bonus,
          item.post_terminal_bonus, item.post_surrender_total, item.status,
        ].forEach((value) => {
          const cell = document.createElement('td'); cell.textContent = value; row.append(cell);
        });
        tbody.append(row);
      });
      table.append(tbody);
    }
    function financeCsvText(result) {
      const rows = result.rows.map((row) => [row.age, row.policy_year, row.requested_withdrawal, row.cumulative_withdrawal]);
      return [['age', 'policy_year', 'medical_premium', 'cumulative_withdrawal'], ...rows]
        .map((row) => row.map((value) => `"${value}"`).join(',')).join('\r\n');
    }
    function invalidateFinanceResult() {
      currentFinanceResult = null;
      clearElement(document.getElementById('financeSummary'));
      clearElement(document.getElementById('financeTable'));
    }
    function buildStateTransitionRows() { return { rows: [] }; }
    function simulateMedicalFinancing() { return { rows: [], modelVersion: 'fixture-v1' }; }
    function canFundMedicalSchedule() { return { funded: true, result: simulateMedicalFinancing() }; }
    function findMinimumAnnualPremium() { return { annual: 1, funded: true }; }
    function medicalRowsFromTable(planId, formId, deductibleId, startAge, endAge) {
      if (planId !== 'aia_avsw' || formId !== 'rider' || deductibleId !== '18000') {
        throw new Error('fixture selection mismatch');
      }
      return Array.from({ length: endAge - startAge + 1 }, (_, index) => ({
        age: startAge + index,
        medicalPremium: 500 + startAge + index,
      }));
    }
    window.GFFinanceCore = {
      buildStateTransitionRows,
      simulateMedicalFinancing,
      canFundMedicalSchedule,
      findMinimumAnnualPremium,
      financeCsvText,
    };
  </script>
  <script src="../assets/gf/gf_model_minimum_basic_patch.js"></script>
  <script src="../assets/gf/gf_model_presentation.js"></script>
  <script>
    const initiallyHidden = document.getElementById('financeSummary').hidden
      && document.querySelector('.tableWrap').hidden;
    const result = {
      input: { annual: 4000, total: 20000 },
      schedule: { 70: 1000, 71: 2000, 72: 3000 },
      requestedTotal: 6000,
      actualTotal: 6000,
      surrendered: false,
      surrenderYear: null,
      rows: [
        { age: 98, policy_year: 70, requested_withdrawal: 1000, withdrawal_total: 1000, cumulative_withdrawal: 1000, post_guaranteed_cash: 100, post_reversionary_bonus: 200, post_terminal_bonus: 300, post_surrender_total: 600, status: '已提款' },
        { age: 99, policy_year: 71, requested_withdrawal: 2000, withdrawal_total: 2000, cumulative_withdrawal: 3000, post_guaranteed_cash: 110, post_reversionary_bonus: 210, post_terminal_bonus: 310, post_surrender_total: 630, status: '已提款' },
        { age: 100, policy_year: 72, requested_withdrawal: 3000, withdrawal_total: 3000, cumulative_withdrawal: 6000, post_guaranteed_cash: 120, post_reversionary_bonus: 220, post_terminal_bonus: 320, post_surrender_total: 660, status: '已提款' },
      ],
    };
    const originalSnapshot = JSON.stringify(result);
    renderFinanceResult(result);

    const results = [];
    function test(name, fn) {
      try { fn(); results.push(`PASS ${name}`); }
      catch (error) { results.push(`FAIL ${name}: ${error.message}`); }
    }
    function assert(condition, message) { if (!condition) throw new Error(message); }

    test('首次進入不預先顯示結果', () => {
      assert(initiallyHidden, '補丁載入後仍預先顯示摘要或列表');
      assert(!document.getElementById('financeSummary').hidden && !document.querySelector('.tableWrap').hidden, '計算後沒有顯示結果');
      assert(document.getElementById('financePdfDownload')?.textContent === '下載 PDF', '欠缺下載 PDF 按鈕');
      assert(!document.getElementById('financePdfDownload').disabled, '計算完成後 PDF 按鈕沒有啟用');
    });

    test('99歲保留而100歲從UI移除', () => {
      const ages = Array.from(document.querySelectorAll('#financeTable tbody tr')).map((row) => Number(row.cells[0].textContent));
      assert(JSON.stringify(ages) === JSON.stringify([98, 99]), `UI年齡錯誤：${ages}`);
      assert(document.getElementById('financeAgeLimitNote')?.textContent.includes('99 歲'), '欠缺99歲顯示提示');
    });

    test('摘要只計算至99歲', () => {
      const cards = Object.fromEntries(Array.from(document.querySelectorAll('#financeSummary .metric')).map((card) => [card.querySelector('span').textContent, card.querySelector('b').textContent]));
      assert(cards['醫療保費總額'] === 'USD 3,000', `醫療總額錯誤：${cards['醫療保費總額']}`);
      assert(cards['實際累計提款'] === 'USD 3,000', `實際提款錯誤：${cards['實際累計提款']}`);
      assert(cards['截至 99 歲狀態'] === '保單持續', '狀態卡沒有清楚標示99歲範圍');
      assert(document.querySelector('#financeSummary > .gf-summary-title')?.textContent === '建議摘要', '摘要欠缺共同表題');
      const summaryStyle = getComputedStyle(document.getElementById('financeSummary'));
      const metricStyle = getComputedStyle(document.querySelector('#financeSummary .metric'));
      assert(summaryStyle.borderTopStyle === 'solid' && metricStyle.boxShadow === 'none', '摘要仍是獨立浮動卡片');
      const firstValue = document.querySelector('#financeSummary .metric b');
      assert(firstValue.textContent === 'USD 4,000' && firstValue.getBoundingClientRect().right <= document.documentElement.clientWidth, `摘要數值超出手機畫面：${firstValue.getBoundingClientRect().right}/${document.documentElement.clientWidth}`);
    });

    test('淺藍說明只顯示年繳及五年總保費', () => {
      const lines = Array.from(document.querySelectorAll('#financeNotice > div')).map((line) => line.textContent);
      assert(lines.join('|') === '年繳保費：USD 4,000|五年總保費：USD 20,000', `保費說明錯誤：${lines}`);
      assert(!document.getElementById('financeNotice').textContent.includes('baseline'), '仍顯示舊有研究說明');
    });

    test('醫療融資CSV與UI同樣截止99歲', () => {
      const csv = financeCsvText(result);
      assert(csv.includes('"99","71","2000","3000"'), 'CSV欠缺99歲');
      assert(!csv.includes('"100","72"'), 'CSV仍包含100歲');
      assert(csv.includes('"maximum_display_age","99"'), 'CSV欠缺99歲範圍追溯');
      assert(GFFinanceCore.financeCsvText(result) === csv, 'GFFinanceCore仍使用未截斷匯出');
    });

    test('顯示補丁沒有改寫計算結果', () => {
      assert(JSON.stringify(result) === originalSnapshot, '原始result被改寫');
      assert(currentFinanceResult === result, 'currentFinanceResult不再指向原計算結果');
      assert(result.rows.length === 3 && result.actualTotal === 6000, '引擎數值被截斷');
    });

    test('建議書式兩層分組表頭', () => {
      const rows = document.querySelectorAll('#financeTable thead tr');
      const group = document.querySelector('#financeTable thead .gf-value-group');
      assert(rows.length === 2, `表頭不是兩層：${rows.length}`);
      assert(group?.textContent === '現金提取後之保單價值' && group.colSpan === 4, '組件模式分組表頭或colspan錯誤');
      assert(Array.from(rows[1].cells).map((cell) => cell.textContent).join('|') === '保證現金價值|復歸紅利|終期紅利|總額', '第二層價值欄錯誤');
      const topLabels = Array.from(rows[0].cells).map((cell) => cell.textContent);
      assert(topLabels.join('|') === '年齡|保單年度|實際提款醫療保費|現金提取後之保單價值|狀態|累計提款', `第一層欄位次序錯誤：${topLabels}`);
      const firstBodyRow = document.querySelector('#financeTable tbody tr');
      assert(firstBodyRow.cells.length === 9 && firstBodyRow.cells[2].textContent === '1000', '醫療保費與實際提款沒有合併成一欄');
      const lastBodyCell = firstBodyRow.cells[firstBodyRow.cells.length - 1];
      assert(lastBodyCell.textContent === '1000' && lastBodyCell.classList.contains('gf-cumulative'), '累計提款不是最右黃色欄');

      const totalTable = document.createElement('table');
      totalTable.innerHTML = '<thead><tr><th>年齡</th><th>保單年度</th><th>醫療保費</th><th>實際提款</th><th>累計提款</th><th>提款後總額</th><th>狀態</th></tr></thead>';
      GFPresentationPatch.buildGroupedHeader(totalTable);
      assert(totalTable.querySelector('.gf-value-group')?.colSpan === 1, '總額模式分組表頭colspan錯誤');
      assert(totalTable.querySelector('thead tr:nth-child(2) th')?.textContent === '總額', '總額模式第二層欄名錯誤');
    });

    test('所有尺寸維持連續表格及固定首兩欄', () => {
      const firstRow = document.querySelector('#financeTable tbody tr');
      assert(document.querySelector('.tableWrap').classList.contains('gf-finance-table-wrap'), '結果表未套用專用樣式類別');
      assert(getComputedStyle(document.getElementById('financeTable')).display === 'table', '表格被轉成block/card');
      assert(getComputedStyle(firstRow).display === 'table-row', '年度列被轉成卡片');
      assert(firstRow.cells[0].classList.contains('gf-sticky-age') && firstRow.cells[1].classList.contains('gf-sticky-year'), '首兩欄沒有sticky類別');
      assert(getComputedStyle(firstRow.cells[0]).position === 'sticky' && getComputedStyle(firstRow.cells[1]).position === 'sticky', '首兩欄CSS不是sticky');
      assert(firstRow.classList.contains('gf-five-year-divider'), '第70保單年度欠缺五年分隔線');
      assert(!firstRow.cells[0].dataset.label, '仍殘留手機卡片data-label');
      assert(firstRow.cells[0].getBoundingClientRect().width <= 43 && firstRow.cells[1].getBoundingClientRect().width <= 55, '年齡或保單年度欄仍然太寬');
    });

    test('輸入變更後隱藏舊結果', () => {
      invalidateFinanceResult();
      assert(document.getElementById('financeSummary').hidden && document.querySelector('.tableWrap').hidden, '輸入變更後舊結果仍顯示');
      assert(document.getElementById('financePdfDownload').disabled, '輸入變更後 PDF 按鈕仍可下載舊結果');
    });

    test('PDF攜帶完整官方醫療保費率', () => {
      const context = GFPresentationPatch.buildMedicalContextForPdf({
        source: 'table',
        planId: 'aia_avsw',
        formId: 'rider',
        deductibleId: '18000',
        planName: 'AIA 自願醫保睿選計劃',
        formName: '附加契約',
        deductibleLabel: 'HKD 18,000／USD 2,250',
      });
      assert(context.premiumByAge.length === 100, `官方保費率行數錯誤：${context.premiumByAge.length}`);
      assert(context.premiumByAge[29].age === 29 && context.premiumByAge[29].premium === 529, '官方保費率年齡映射錯誤');
      assert(GFPresentationPatch.buildMedicalContextForPdf({ source: 'manual' }).source === 'manual', '手動輸入被誤當官方表');
    });

    renderFinanceResult(result);
    const report = document.createElement('pre');
    report.id = 'report'; report.textContent = results.join('\n'); document.body.append(report);
  </script>
</body>
</html>
